<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fc8ff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#hud .hearts{font-size:22px;letter-spacing:1px}
#hud .cnt{font-size:18px;font-weight:700;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:14px;white-space:nowrap}
#pauseBtn{pointer-events:auto;margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px}
#prog{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:7px;border-radius:4px;background:rgba(0,0,0,.25);pointer-events:none}

#prog b{position:absolute;top:-11px;margin-left:-11px;font-size:18px;left:0}
#prog span{position:absolute;right:-6px;top:-16px;font-size:18px}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,40,70,.28);overflow:auto}
.card{background:#fffaf0;border-radius:24px;padding:20px 18px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);color:#4a3a28;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
h1{margin:0 0 4px;font-size:28px;text-align:center;color:#e67e22}
.sub{text-align:center;font-size:15px;margin:0 0 14px;color:#8a6d4b}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.md{display:flex;align-items:center;gap:8px;border:0;border-radius:16px;padding:10px 10px;font-size:17px;position:relative;font-weight:700;color:#3d2e1e;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.md:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.md .ic{font-size:32px;line-height:1}
.md small{display:block;font-weight:400;font-size:12.5px;margin-top:2px;opacity:.85;line-height:1.3}
.md .best{display:block;color:#f5a623;font-size:13px;letter-spacing:1px;margin-top:1px}
.md .nm{white-space:nowrap}
.md.ski{background:linear-gradient(135deg,#eef6ff,#cfe4ff)}
.md.grass{background:linear-gradient(135deg,#e6f8d4,#b8e89a)}
.md.river{background:linear-gradient(135deg,#d8f3ff,#9fdcf5)}
.md.desert{background:linear-gradient(135deg,#fff3d6,#f7d08a)}
.md.autumn{background:linear-gradient(135deg,#ffe8d2,#f6b27a)}
.md.candy{background:linear-gradient(135deg,#ffe6f4,#f9b8de)}
.md.ice{background:linear-gradient(135deg,#e2f4ff,#a8d6f2)}
.md.sakura{background:linear-gradient(135deg,#fff0f5,#ffc8da)}
.md.surf{background:linear-gradient(135deg,#dcfbff,#8fe0ea)}

.opts{display:flex;gap:8px;margin-top:12px}
.opts button{flex:1;border:2px solid #e0c9a0;background:#fff;border-radius:12px;padding:10px;font-size:16px;color:#4a3a28}
.how{font-size:15px;line-height:1.65;background:#fff3d6;border-radius:14px;padding:10px 12px;margin-top:12px}

.res .stars{font-size:44px;color:#f5a623;letter-spacing:6px;margin:4px 0}

.res p{font-size:17px;margin:6px 0}

<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="hearts" id="hHearts">❤️❤️❤️</div>
  <div class="cnt" id="hCnt">❄️ 0</div>

<div id="prog" class="hide"><i id="progI"></i><b id="progB">🐣</b><span>🏠</span></div>
<div id="hint" class="hide"></div>

<div id="menu" class="scr">
  <div class="card">
    <h1>🐣 小暖滑滑樂</h1>
    <p class="sub">陪小暖滑雪、滑沙、溜冰、漂流、衝浪，九個地方一路玩回家！</p>
    <div class="modes" id="modeList"></div>
    <div class="opts">
      <button id="spdBtn">🐢 速度：慢</button>
      <button id="sndBtn">🔊 音效：開</button>
    </div>
    <div class="how">
      <b>⛷️ 滑坡關：</b>小暖會自己往下滑。點一下畫面＝跳，空中再點＝二段跳。飛在空中時<b>按住不放</b>小暖會翻跟斗，落地站穩有加分！<br>
      <b>🛟 漂流關：</b>手指按住畫面左右移動，小暖會往手指的方向划過去。躲開障礙物，順便救起迷路的小鴨鴨、小海龜。<br>
      🍭 糖果王國的綠色果凍會把小暖彈飛；🧊 冰洞的冰面特別滑，會越溜越快。
    </div>
  </div>
</div>

<div id="result" class="scr hide">
  <div class="card res">
    <div class="big" id="rIcon">🎉</div>

    <div class="stars" id="rStars"></div>

    <div class="tip" id="rTip"></div>
    <div class="btns">
      <button class="alt" id="rMenu">選關卡</button>
      <button id="rAgain">再玩一次</button>
      <button class="nx" id="rNext">下一關 ▶</button>
    </div>
  </div>
</div>

<div id="pause" class="scr hide">
  <div class="card res">
    <div class="big">⏸</div><h1>休息一下</h1>

    <div class="btns" style="margin-top:14px"><button class="alt" id="pMenu">回選單</button><button id="pGo">繼續玩</button></div>
  </div>
</div>

<script>

function tone(f,d,type,vol,slide){if(!AC||!SAVE.snd)return;try{var o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  gn.gain.setValueAtTime(vol||.15,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,vol,freq){if(!AC||!SAVE.snd)return;try{var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  var s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq||1200;gn.gain.value=vol||.2;s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start();}catch(e){}}

  power:function(){[523,659,784,1047,1319].forEach(function(f,i){setTimeout(function(){tone(f,.12,'triangle',.12);},i*70);});},

/* ---------- 工具 ---------- */

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(.1,r),0,6.2832);g.fill();}
function ell(x,y,rx,ry,c,rot){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,6.2832);g.fill();}
function rrPath(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function rr(x,y,w,h,r,c){g.fillStyle=c;rrPath(x,y,w,h,r);g.fill();}
function angNorm(a){while(a>Math.PI)a-=6.2832;while(a<-Math.PI)a+=6.2832;return a;}

   tip:'<b>小暖說：</b>糖果很好吃，但一次不要吃太多喔！吃完甜食記得刷牙、多喝白開水，牙齒才會健康。',

/* ================= 滑坡（滑雪／滑草） ================= */
var KS=760,P={};
function h0(x){var f=Math.min(1,Math.max(0,x)/700),
  y=.3*x+f*(38*Math.sin(x/170+P.p1)+22*Math.sin(x/88+P.p2)+58*Math.sin(x/430+P.p3));
  var c=Math.floor(x/KS);for(var i=c-1;i<=c+1;i++){var k=P.k[i];if(k){var dx=x-k.x;if(dx>-260&&dx<260)y-=k.a*Math.exp(-dx*dx/(2*k.s*k.s));}}
  return y;}
function hT(x){if(x<=P.L)return h0(x);var dx=x-P.L;
  if(dx<=300)return P.hL+P.sL*dx+(.02-P.sL)*dx*dx/600;
  return P.hL+P.sL*300+(.02-P.sL)*150+.02*(dx-300);}
function sl(x){return (hT(x+1)-hT(x-1))/2;}
function cu(x){return (hT(x+3)-2*hT(x)+hT(x-3))/9;}

function slopeInit(){
  var M=MODES[G.mode],L=M.L;
  P={p1:rnd(0,6.28),p2:rnd(0,6.28),p3:rnd(0,6.28),k:[],L:L};
  for(var c=0;c*KS<L+2000;c++)P.k[c]=(c>=1&&c*KS<L-500&&Math.random()<.75)?{x:c*KS+rnd(180,KS-180),a:rnd(30,46),s:rnd(46,58)}:null;
  P.hL=h0(L);P.sL=(h0(L+1)-h0(L-1))/2;
  var V=G.V=SAVE.slow?{min:165,max:430,top:470}:{min:215,max:560,top:620};
  var pl=G.pl={x:60,y:0,v:V.min+30,vy:0,onG:true,ang:0,rot:0,jumps:0,tumble:0,boost:0,spin:false,flips:0};
  pl.y=hT(pl.x);
  var E=G.ents=[];G.total=0;
  function coin(x,y){E.push({k:'coin',x:x,y:y,ph:Math.random()*6});G.total++;}
  // 跳台後面的空中收集物
  var vt=(V.min+V.max)/2,boosts=0;
  for(c=0;c<P.k.length;c++){var k=P.k[c];if(!k)continue;
    var px=k.x,py=hT(px),vy0=vt*sl(px);
    for(var i=1;i<=7;i++){var dx=i*48,t=dx/vt,y=py-34+vy0*t+450*t*t;if(y>hT(px+dx)-26)break;
      if(i===4&&boosts<3&&Math.random()<.35){E.push({k:'boost',x:px+dx,y:y-36,ph:0});boosts++;}
      coin(px+dx,y);}
    E.push({k:'flag',x:k.x-30});}
  // 地面障礙＋收集物
  var x=650;
  while(x<L-250){
    var near=false;for(c=Math.floor(x/KS)-1;c<=Math.floor(x/KS)+1;c++){var kk=P.k[c];if(kk&&x>kk.x-200&&x<kk.x+420)near=true;}
    if(near){x+=90;continue;}
    var r=Math.random();
    if(r<.55){var t2=pick(M.obs),o={k:'obs',t:t2,x:x};
      o.w=OBW[t2];o.h=OBH[t2];
      E.push(o);
      if(!SLOW[t2]&&Math.random()<.7)for(i=0;i<5;i++){var ax=x-80+i*40,aa=i/4;coin(ax,hT(ax)-30-Math.sin(aa*Math.PI)*(o.h+46));}
      x+=rnd(360,560);}
    else{var n=4+Math.floor(Math.random()*3);for(i=0;i<n;i++){var cx=x+i*38;coin(cx,hT(cx)-24);}x+=n*38+rnd(220,380);}
  }
  E.sort(function(a,b){return a.x-b.x;});
  G.camX=pl.x-W*.3;G.camY=pl.y-H*.5;
}

function tapSlope(){
  var pl=G.pl;if(pl.tumble>0||G.state!=='play')return;
  if(pl.onG){pl.vy=pl.v*sl(pl.x)-400;pl.onG=false;pl.jumps=1;SFX.jump();}
  else if(pl.jumps<2){pl.vy=-330;pl.jumps=2;SFX.jump2();burst(pl.x,pl.y,6,'#fff');}
}

function updSlope(dt){
  var pl=G.pl,V=G.V,M=MODES[G.mode],GR=900,playing=G.state==='play';
  if(pl.boost>0)pl.boost-=dt;
  var vmax=pl.boost>0?V.top:V.max*(M.slick?1.12:1),vmin=V.min;
  var stopping=pl.x>P.L&&G.state!=='play';if(stopping&&!G.decel)G.decel=Math.max(200,pl.v*pl.v/(2*300));
  if(pl.x>P.L&&G.state==='play')vmin=Math.min(vmin,140);
  if(pl.onG){
    var s=sl(pl.x),sn=s/Math.sqrt(1+s*s);
    var slick=MODES[G.mode].slick;pl.v+=(650*sn-(slick?.36:.55)*pl.v+70)*dt;
    if(pl.boost>0)pl.v+=300*dt;
    if(pl.tumble>0){pl.tumble-=dt;pl.v-=120*dt;}
    if(stopping){pl.v-=(G.decel||300)*dt+(650*sn-.55*pl.v+70)*dt;if(pl.v<0)pl.v=0;}
    pl.v=clamp(pl.v,stopping?0:vmin*(pl.tumble>0?.6:1),vmax);
    pl.x+=pl.v*dt;
    if(cu(pl.x)>GR/(pl.v*pl.v+1)&&pl.v>120){pl.onG=false;pl.vy=pl.v*s;pl.jumps=1;}
    else{pl.y=hT(pl.x);pl.vy=pl.v*sl(pl.x);}
    var ga=Math.atan(sl(pl.x));
    if(pl.tumble>0)pl.ang+=12*dt;else pl.ang+=angNorm(ga-pl.ang)*Math.min(1,14*dt);
    // 雪花／草屑
    if(pl.v>150&&Math.random()<dt*30)G.pt.push({x:pl.x-10,y:pl.y-2,vx:-rnd(20,90),vy:-rnd(40,140),l:.6,c:pick(M.spray),r:rnd(1.5,3.2)});
  }else{
    pl.x+=pl.v*dt;pl.vy+=GR*dt;pl.y+=pl.vy*dt;
    var spinning=playing&&G.held&&G.t-G.pressT>.16&&pl.tumble<=0;
    pl.spin=spinning;
    if(spinning){pl.ang-=7.8*dt;pl.rot-=7.8*dt;}
    else if(pl.tumble>0)pl.ang+=12*dt;
    else pl.ang+=angNorm(Math.atan2(pl.vy,pl.v)*.45-pl.ang)*Math.min(1,4*dt);
    var gy=hT(pl.x);
    if(pl.y>=gy){
      pl.y=gy;pl.onG=true;pl.jumps=0;
      var ga2=Math.atan(sl(pl.x)),d=angNorm(pl.ang-ga2),flips=Math.floor((Math.abs(pl.rot)+1)/6.2832);
      if(pl.tumble>0){}
      else if(Math.abs(d)<1.15||G.demo){
        if(flips>0&&playing){var b=flips*3;G.got+=b;pl.flips+=flips;addFx(pl.x,pl.y-60,flips>1?('翻轉 ×'+flips+'！+'+b):'翻轉成功！+'+b,'#ff6b9d',1.4);SFX.trick();burst(pl.x,pl.y,14,'#ffd54a');}
        else SFX.land();
        pl.ang=ga2;
      }else{
        pl.tumble=.9;pl.v*=.6;SFX.bump();shake=4;addFx(pl.x,pl.y-60,'哎呀～沒站穩','#fff',1.2);burst(pl.x,pl.y,14,M.spray[0]);
      }
      pl.rot=0;
      if(pl.tumble<=0)pl.ang=ga2;
    }
  }
  if(pl.tumble<=0&&pl.onG){}
  // 碰撞
  if(playing&&!G.demo)collideSlope(pl);
  // 攝影機
  G.camX=pl.x-W*.3;
  var ty=pl.y-H*.5;G.camY+=(ty-G.camY)*Math.min(1,5*dt);
  if(Math.abs(ty-G.camY)>H*.38)G.camY=ty-Math.sign(ty-G.camY)*H*.38;
  // 終點
  if(G.state==='play'&&pl.x>P.L+330){win();}
}

function collideSlope(pl){
  var E=G.ents;
  for(var i=0;i<E.length;i++){var e=E[i];if(e.x<pl.x-80)continue;if(e.x>pl.x+80)break;
    if(e.k==='coin'||e.k==='boost'){if(e.got)continue;var dx=e.x-pl.x,dy=e.y-(pl.y-16);
      if(dx*dx+dy*dy<30*30){e.got=true;
        if(e.k==='coin'){G.got++;SFX.coin();burst(e.x,e.y,5,'#ffe066');}
        else{pl.boost=4.5;SFX.power();addFx(pl.x,pl.y-64,'⭐ 衝刺星！無敵衝衝衝','#ffd23f',1.6);burst(e.x,e.y,18,'#ffd23f');}}}
    else if(e.k==='obs'&&!e.hit){
      if(Math.abs(e.x-pl.x)<e.w/2+6&&pl.y>hT(e.x)-e.h+6){
        e.hit=true;
        if(SLOW[e.t]){pl.v*=.62;SFX.splash();var sw={mud:['噗滋～泥巴','#7a5a3a'],quick:['陷進流沙了！','#c48d4c'],leafpile:['沙沙沙～落葉堆','#e8622c'],drift:['噗！雪堆','#ffffff']}[e.t];
          addFx(pl.x,pl.y-50,sw[0],'#fff',1);for(var j=0;j<12;j++)G.pt.push({x:pl.x,y:pl.y,vx:rnd(-80,80),vy:-rnd(60,200),l:.7,c:e.t==='leafpile'?pick(MODES.autumn.spray):sw[1],r:rnd(2,4)});}
        else if(e.t==='jelly'){pl.onG=false;pl.vy=-560;pl.jumps=1;e.boing=.5;tone(300,.35,'sine',.2,900);addFx(pl.x,pl.y-60,'果凍彈彈～飛起來！','#66bb6a',1.2);}
        else if(pl.boost>0){e.fly=1;SFX.bump();G.got+=1;addFx(e.x,e.y||pl.y-40,'撞飛！+1','#ffd23f',1);}
        else if(G.inv<=0){G.hearts--;G.inv=1.6;pl.v*=.5;SFX.hurt();shake=7;pl.tumble=.6;
          addFx(pl.x,pl.y-60,G.hearts>0?'好痛！小心喔':'嗚…','#ff5a5a',1.2);burst(pl.x,pl.y-14,10,'#fff');
          if(G.hearts<=0)lose();}
      }}
  }
}

/* ---------- 滑坡繪圖 ---------- */
function hsh(n){return Math.abs(Math.sin(n*12.9898)*43758.5453)%1;}
function farY(wx,base,m){
  if(m==='ice')return base-90-50*Math.abs(((wx/90)%2+2)%2-1)-25*Math.sin(wx/170);
  if(m==='desert')return base-50-55*Math.sin(wx/260)-15*Math.sin(wx/91);
  return base-70-60*Math.abs(Math.sin(wx/230))-30*Math.sin(wx/97);}
function drawSlopeBG(){

  if(m==='ice'){g.strokeStyle='rgba(200,245,255,.35)';g.lineWidth=2;g.beginPath();for(x=0;x<=W+20;x+=20){wx=x-off;if(x)g.lineTo(x,farY(wx,base,m)+3);else g.moveTo(x,farY(wx,base,m)+3);}g.stroke();}
  off=-cx*.12;g.fillStyle=M.near;g.beginPath();g.moveTo(0,H);
  for(x=0;x<=W+20;x+=20){wx=x-off;g.lineTo(x,base-10-34*Math.sin(wx/160)-18*Math.sin(wx/63));}g.lineTo(W,H);g.fill();

function drawTerrain(){

  function edgeLine(off,col,lw){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();for(var s=-5;s<=W+10;s+=6){var yy=hT(cx+s)-cy+off;if(s<0)g.moveTo(s,yy);else g.lineTo(s,yy);}g.stroke();}
  if(M.edge==='rainbow'){var RB=['#ff5a5a','#ffa53a','#ffe04a','#5fd36a','#4fb3ff','#9c6bff'];for(var k=0;k<6;k++)edgeLine(2+k*5,RB[k],5.5);edgeLine(0,'#fff',2);}

    if(m==='ski'){if(hs<.4)ell(X,y+14+hs*30,12,2.5,'rgba(160,190,230,.45)');}

    else if(m==='autumn'){for(var q=0;q<2;q++){var lc=['#e8622c','#f2a23a','#d9412b','#ffd04a'][Math.floor(hs*40+q)%4];ell(X+q*17,y+3+q*5+hs*6,5,2.6,lc,hs*3+q);}}

    else if(e.k==='coin'&&!e.got)drawCoin(M.coin,sx,e.y-cy,e.ph);
    else if(e.k==='boost'&&!e.got)drawCoin('boost',sx,e.y-cy,0);
    else if(e.k==='flag'){var fy2=hT(e.x)-cy;g.fillStyle='#6d4c41';g.fillRect(sx-1,fy2-34,3,34);g.fillStyle=G.mode==='ski'?'#ff5252':'#ffb300';g.beginPath();g.moveTo(sx+2,fy2-34);g.lineTo(sx+20,fy2-28);g.lineTo(sx+2,fy2-22);g.fill();}
  }
  drawParticles(cx,cy);
  var px=pl.x-cx,py=pl.y-cy,blink=G.inv>0&&Math.floor(G.inv*12)%2===0;
  if(!blink){
    if(pl.boost>0){circ(px,py-16,30,'rgba(255,220,80,'+(.25+.1*Math.sin(G.t*15))+')');}
    g.save();g.translate(px,py);g.rotate(pl.ang);drawRide(M,pl);g.restore();
  }
  drawWeather();
  drawFx(cx,cy);
}

/* ================= 河流漂流 ================= */
var R={};
function rC(d){return 110*Math.sin(d/420+R.p1)+55*Math.sin(d/190+R.p2);}
function rapid(d){var v=0;for(var i=0;i<R.rap.length;i++){var a=R.rap[i];if(d>a[0]-220&&d<a[1]+220){var u=d<a[0]?(d-a[0]+220)/220:d>a[1]?(a[1]+220-d)/220:1;u=u*u*(3-2*u);if(u>v)v=u;}}return v;}
function rHW(d){var base=125+35*Math.sin(d/260+R.p3);base*=1-.36*rapid(d);if(d>R.L-200)base+=Math.min(400,(d-R.L+200)*1.2);if(d<300)base+=(300-d)*.4;return base;}
function rFlow(d){var b=SAVE.slow?150:200;return b*(1+.75*rapid(d))*(d>R.L?Math.max(.15,1-(d-R.L)/400):1);}

function riverInit(){
  var M=MODES[G.mode],L=M.L;
  R={p1:rnd(0,6.28),p2:rnd(0,6.28),p3:rnd(0,6.28),L:L,rap:[]};if(G.mode==='sakura'){R.p1*=1;}
  for(var d=1800;d<L-900;d+=rnd(1700,2600)){R.rap.push([d,d+rnd(400,650)]);}
  var pl=G.pl={x:rC(0),d:0,vx:0,dizzy:0,spinA:0,hist:[]};
  G.ducks=0;G.duckTotal=0;G.camX=pl.x;
  var E=G.ents=[];G.total=0;
  d=500;
  while(d<L-200){
    var c=rC(d),hw=rHW(d)-30,r=Math.random(),rp=rapid(d)>.5;
    if(r<.42){var t=rp?pick(M.rapObs):pick(M.obs);
      var o={k:'obs',t:t,d:d,x:c+rnd(-hw*.8,hw*.8),r:(t==='rock'||t==='reef')?rnd(15,21):t==='jelly'?15:(t==='whirl'||t==='wave')?34:0,w:t==='log'?rnd(80,110):0,a:t==='log'?rnd(-.4,.4):0};
      E.push(o);
      if(Math.random()<.6){var side=o.x>c?-1:1,lx=o.x+side*rnd(55,80);if(Math.abs(lx-c)<hw){E.push({k:'coin',d:d,x:lx,ph:Math.random()*6});G.total++;}}
      d+=rnd(rp?150:200,rp?240:330);}
    else if(r<.8){var n=4+Math.floor(Math.random()*3),x0=c+rnd(-hw*.6,hw*.6),dx=rnd(-14,14);
      for(var i=0;i<n;i++){var dd=d+i*42,xx=clamp(x0+dx*i,rC(dd)-rHW(dd)+35,rC(dd)+rHW(dd)-35);E.push({k:'coin',d:dd,x:xx,ph:i});G.total++;}
      d+=n*42+rnd(150,260);}
    else{E.push({k:'duck',d:d,x:c+rnd(-hw*.7,hw*.7),ph:Math.random()*6});G.duckTotal++;d+=rnd(200,300);}
  }
  // 岸邊裝飾
  R.deco=[];for(d=-400;d<L+900;d+=rnd(60,130)){R.deco.push({d:d,side:Math.random()<.5?-1:1,off:rnd(30,170),t:pick(M.deco)});}
  R.br=null;if(M.bridges){R.br=[];for(d=1200;d<L-300;d+=rnd(1500,2200))R.br.push(d);}
}

function updRiver(dt){
  var pl=G.pl,playing=G.state==='play';
  var f=rFlow(pl.d);pl.d+=f*dt;
  var c=rC(pl.d),hw=rHW(pl.d);
  var ax=0;
  if(playing&&G.held&&!G.demo&&pl.dizzy<=0){var tx=G.camX+(G.ptrX-W/2);ax=clamp((tx-pl.x)*7,-700,700);}
  if(KEY.l)ax=-600;if(KEY.r)ax=600;
  if(G.demo){var tgt=c+Math.sin(G.t*.7)*hw*.4;ax=(tgt-pl.x)*3;}
  ax+=(c-pl.x)*.5; // 水流往中間帶
  if(pl.dizzy>0){pl.dizzy-=dt;pl.spinA+=10*dt;ax+=Math.sin(G.t*9)*400;}
  pl.vx+=ax*dt;pl.vx*=Math.pow(.18,dt);
  pl.x+=pl.vx*dt;
  // 岸
  var lim=hw-20;
  if(pl.x>c+lim){pl.x=c+lim;if(pl.vx>40){SFX.bump();shake=2;}pl.vx=-Math.abs(pl.vx)*.5-30;}
  if(pl.x<c-lim){pl.x=c-lim;if(pl.vx<-40){SFX.bump();shake=2;}pl.vx=Math.abs(pl.vx)*.5+30;}
  pl.hist.unshift({x:pl.x,d:pl.d});if(pl.hist.length>240)pl.hist.pop();
  if(Math.random()<dt*(6+rapid(pl.d)*20))G.pt.push({x:pl.x+rnd(-18,18),y:-pl.d+10,vx:rnd(-20,20),vy:rnd(20,60),l:.5,c:'rgba(255,255,255,.8)',r:rnd(1.5,3)});
  G.camX+=(pl.x-G.camX)*Math.min(1,3*dt);
  if(playing&&!G.demo)collideRiver(pl);
  if(G.state==='play'&&pl.d>R.L+220)win();
}

function collideRiver(pl){
  var E=G.ents;
  for(var i=0;i<E.length;i++){var e=E[i];if(e.d<pl.d-80)continue;if(e.d>pl.d+80)break;
    var dx=e.x-pl.x,dy=e.d-pl.d;
    if(e.k==='coin'){if(!e.got&&dx*dx+dy*dy<30*30){e.got=true;G.got++;SFX.coin();burst(e.x,-e.d,5,'#ffc2d6');}}
    else if(e.k==='duck'){if(!e.got&&dx*dx+dy*dy<34*34){e.got=true;G.ducks++;SFX.duck();addFx(pl.x,-pl.d-50,'救到'+MODES[G.mode].bname+'！','#ffd54a',1.3);}}
    else if(e.k==='obs'&&!e.hit){
      var hit=false;
      if(e.t==='rock'||e.t==='reef'||e.t==='jelly')hit=dx*dx+dy*dy<(e.r+16)*(e.r+16);
      else if(e.t==='whirl'||e.t==='wave')hit=dx*dx+dy*dy<(e.r+4)*(e.r+4);
      else{var ca=Math.cos(e.a),sa=Math.sin(e.a),lx=-dx*ca-dy*-sa,ly=-dx*sa+(-dy)*ca;hit=Math.abs(lx)<e.w/2+14&&Math.abs(ly)<9+14;}
      if(!hit)continue;
      e.hit=true;
      if(e.t==='whirl'){pl.dizzy=1.3;SFX.whirl();addFx(pl.x,-pl.d-50,'轉～轉～頭好暈','#fff',1.3);}
      else if(e.t==='wave'){pl.dizzy=1;pl.vx=(dx>0?-1:1)*320;SFX.splash();addFx(pl.x,-pl.d-50,'嘩～大浪打過來！','#fff',1.3);burst(pl.x,-pl.d,14,'#fff');}
      else if(G.inv<=0){G.hearts--;G.inv=1.6;SFX.hurt();SFX.splash();shake=7;pl.vx=(dx>0?-1:1)*260;
        addFx(pl.x,-pl.d-50,G.hearts>0?({rock:'撞到石頭了！',log:'撞到木頭了！',reef:'撞到珊瑚礁了！',jelly:'被水母電到了！麻麻的'}[e.t]):'嗚…','#ff5a5a',1.2);burst(pl.x,-pl.d,12,'#fff');
        if(G.hearts<=0)lose();}
    }
  }
}

function drawRiver(){
  var M=MODES[G.mode],m=G.mode,pl=G.pl,PY=H*.7,cx=G.camX,t=G.t,i,k,dd,o,x,y;
  function SX(x){return W/2+(x-cx);}
  function SY(d){return PY-(d-pl.d);}
  g.fillStyle=M.bg;g.fillRect(0,0,W,H);

  if(M.tuft){for(dd=Math.floor(d0/34)*34;dd<d1;dd+=34){var hs=hsh(dd);
    for(k=0;k<3;k++){var gx=((hs*997+k*W/3)%W);g.strokeStyle=M.tuft;g.lineWidth=2;g.beginPath();g.moveTo(gx,SY(dd));g.lineTo(gx-3,SY(dd)-7);g.moveTo(gx+4,SY(dd));g.lineTo(gx+6,SY(dd)-6);g.stroke();}}}
  else{for(dd=Math.floor(d0/30)*30;dd<d1;dd+=30){hs=hsh(dd);circ((hs*997)%W,SY(dd),1.5,'rgba(190,150,90,.4)');circ((hs*577+W/2)%W,SY(dd)+9,1.2,'rgba(190,150,90,.4)');}}

  function band(pad,col){g.fillStyle=col;g.beginPath();g.moveTo(L[0][0]-pad,L[0][1]);for(var i=1;i<L.length;i++)g.lineTo(L[i][0]-pad,L[i][1]);
    for(i=Rr.length-1;i>=0;i--)g.lineTo(Rr[i][0]+pad,Rr[i][1]);g.closePath();g.fill();}
  band(m==='surf'?26:16,M.bank[0]);band(6,M.bank[1]);

    for(dd=Math.floor(d0/22)*22;dd<d1;dd+=22){var c1=rC(dd),h1=rHW(dd),y1=SY(dd);ell(SX(c1-h1)-10,y1,9,7,hsh(dd)<.5?'#bdbdbd':'#9e9e9e');ell(SX(c1+h1)+10,y1,9,7,hsh(dd+1)<.5?'#bdbdbd':'#9e9e9e');}}

  for(dd=Math.floor(d0/26)*26;dd<d1;dd+=26){var c2=rC(dd),hw2=rHW(dd),rp=rapid(dd),y2=SY(dd);
    if(m==='surf'){if(Math.floor(dd/26)%3)continue;var ph=Math.sin(t*2+dd*.01)*6;g.globalAlpha=.6;g.lineWidth=3;g.beginPath();
      for(x=-hw2+10;x<hw2-10;x+=12){g.lineTo(SX(c2+x),y2+Math.sin(x*.05+t*3)*4+ph);}g.stroke();g.lineWidth=2;continue;}
    var n=rp>.3?4:2;
    for(k=0;k<n;k++){var h2=hsh(dd+k*7.7),x2=c2+(h2*2-1)*(hw2-20),len=rp>.3?22:12;
      g.globalAlpha=rp>.3?.8:.45;g.beginPath();g.moveTo(SX(x2),y2);g.quadraticCurveTo(SX(x2)+3,y2+len/2,SX(x2),y2+len);g.stroke();}}
  g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=m==='surf'?5:3;
  g.beginPath();for(i=0;i<L.length;i++){var wv=Math.sin(t*3+i*.7)*2;if(i)g.lineTo(L[i][0]+3+wv,L[i][1]);else g.moveTo(L[i][0]+3+wv,L[i][1]);}g.stroke();
  g.beginPath();for(i=0;i<Rr.length;i++){wv=Math.sin(t*3+i*.7)*2;if(i)g.lineTo(Rr[i][0]-3+wv,Rr[i][1]);else g.moveTo(Rr[i][0]-3+wv,Rr[i][1]);}g.stroke();
  // 岸邊裝飾
  for(i=0;i<R.deco.length;i++){o=R.deco[i];if(o.d<d0||o.d>d1)continue;var cc=rC(o.d),hh=rHW(o.d);x=SX(cc+o.side*(hh+22+o.off));y=SY(o.d);drawDeco(o.t,x,y,o.side);}
  // 終點
  var fd=R.L;if(fd>d0&&fd<d1){var y3=SY(fd),c3=rC(fd),hw3=rHW(fd);
    g.fillStyle='#8d6e63';g.fillRect(SX(c3-hw3)-8,y3-50,6,50);g.fillRect(SX(c3+hw3)+2,y3-50,6,50);
    g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(SX(c3-hw3)-5,y3-46);g.lineTo(SX(c3+hw3)+5,y3-46);g.stroke();
    for(k=0;k<12;k++){var fx2=SX(c3-hw3)+(k+.5)*(hw3*2)/12;g.fillStyle=['#ff5252','#ffd54a','#4fc3f7','#66bb6a'][k%4];g.beginPath();g.moveTo(fx2-8,y3-46);g.lineTo(fx2+8,y3-46);g.lineTo(fx2,y3-32);g.fill();}
    rr(SX(c3)-40,y3-78,80,24,8,'#ff7043');g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('終點 🏁',SX(c3),y3-66);}
  var hd=R.L+440;if(hd>d0-150&&hd<d1+150){var c4=rC(hd),yh=SY(hd);
    ell(SX(c4),yh,110,52,m==='surf'?'#fff1c9':'#e8d39a');ell(SX(c4),yh-4,98,44,m==='surf'?'#f6dc9c':m==='sakura'?'#a8dc8a':'#8fd36a');
    rr(SX(c4)-12,yh+20,24,46,3,'#a1693f');for(k=0;k<4;k++){g.fillStyle='#7a4f2c';g.fillRect(SX(c4)-12,yh+24+k*11,24,2);}
    if(m==='sakura'){drawDeco('sakura',SX(c4)-74,yh,1);drawDeco('sakura',SX(c4)+76,yh+2,1);}else if(m!=='surf'){circ(SX(c4)-70,yh-8,14,'#3f9b3a');circ(SX(c4)+72,yh-4,12,'#4caf50');}
    drawHome(SX(c4),yh+10,M.home);}
  // 實體
  for(i=0;i<G.ents.length;i++){var e=G.ents[i];if(e.d<d0)continue;if(e.d>d1)break;var ex=SX(e.x),ey=SY(e.d);
    if(e.k==='coin'&&!e.got)drawCoin(M.coin,ex,ey,e.ph);
    else if(e.k==='duck'&&!e.got)drawBuddy(M.buddy,ex,ey,e.ph,true);
    else if(e.k==='obs')drawRiverObs(e,ex,ey);}
  // 夥伴跟隨
  for(i=0;i<G.ducks;i++){var hi=Math.min(pl.hist.length-1,(i+1)*14);if(hi<0)break;var hp=pl.hist[hi];drawBuddy(M.buddy,SX(hp.x),SY(hp.d)+8,i,false);}
  drawParticles(cx-W/2,-PY-pl.d,true);
  // 小暖
  var px=SX(pl.x),py=PY,bob=Math.sin(t*3)*2,blink=G.inv>0&&Math.floor(G.inv*12)%2===0;
  if(!blink){

    g.save();g.translate(px,py+bob);g.rotate(tilt);
    if(M.vessel==='board'){ell(0,10,14,36,'rgba(255,255,255,.45)');ell(0,4,11,32,'#ff7043');ell(0,4,3,30,'#fff');ell(0,4,11,32,'rgba(0,0,0,0)');
      g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.beginPath();g.moveTo(-14,34);g.quadraticCurveTo(0,44+Math.sin(t*8)*3,14,34);g.stroke();
      drawChick(0,8,15,{run:true,ski:true,cheer:cheer,hurt:pl.dizzy>0,acc:'cap',noShadow:true,air:paddle});}
    else if(M.vessel==='tub'){ell(0,8,30,14,'rgba(255,255,255,.4)');ell(0,2,25,13,'#8d5a3a');ell(0,1,20,9,'#5d3a22');
      drawChick(0,-1,15,{sit:true,hurt:pl.dizzy>0,cheer:cheer,acc:'cap',noShadow:true,paddle:paddle});
      g.fillStyle='#a8744c';g.beginPath();g.ellipse(0,2,25,13,0,0,Math.PI);g.lineTo(-25,12);g.ellipse(0,12,25,13,0,Math.PI,0,true);g.closePath();g.fill();
      g.strokeStyle='#5d4037';g.lineWidth=2.5;g.beginPath();g.ellipse(0,6,25,13,0,.1,3.04);g.stroke();g.beginPath();g.ellipse(0,10,25,13,0,.1,3.04);g.stroke();}
    else{ell(0,6,30,13,'rgba(255,255,255,.45)');
      g.lineWidth=11;g.strokeStyle='#ff7043';g.beginPath();g.ellipse(0,2,24,12,0,0,6.28);g.stroke();
      g.strokeStyle='#fff';for(k=0;k<4;k++){g.beginPath();g.ellipse(0,2,24,12,0,k*1.5708+.3,k*1.5708+.75);g.stroke();}
      drawChick(0,-2,15,{sit:true,hurt:pl.dizzy>0,cheer:cheer,acc:'cap',noShadow:true,paddle:paddle});

  if(G.held&&G.state==='play'){g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.setLineDash([4,6]);g.beginPath();g.moveTo(px,py-20);g.lineTo(G.ptrX,py-20);g.stroke();g.setLineDash([]);circ(G.ptrX,py-20,6,'rgba(255,255,255,.7)');}

  g.fillStyle='#ff8a3d';g.beginPath();g.moveTo(r*.85,-r*.06);g.lineTo(r*1.28,r*.08);g.lineTo(r*.85,r*.24);g.fill();
  g.strokeStyle='#3a2a1a';g.fillStyle='#3a2a1a';g.lineWidth=2;
  if(o.hurt){g.beginPath();g.moveTo(r*.3,-r*.32);g.lineTo(r*.54,-r*.12);g.moveTo(r*.54,-r*.32);g.lineTo(r*.3,-r*.12);g.stroke();}
  else if(o.cheer||(t%3.5)<.12){g.beginPath();g.arc(r*.42,-r*.16,r*.13,3.4,6.0);g.stroke();}

    rr(-r*.75,r*.45,r*1.5,r*.3,r*.15,sc);rr(-r*.9,r*.5,r*.3,r*.75,r*.12,sc);

    rr(-r*.75,r*.45,r*1.5,r*.3,r*.15,'#f2a23a');g.fillStyle='#c0392b';g.fillRect(-r*.4,r*.45,r*.12,r*.3);g.fillRect(r*.15,r*.45,r*.12,r*.3);
    var fl2=Math.sin(t*14)*r*.1;rr(-r*.9,r*.5,r*.3,r*.75,r*.12,'#f2a23a');rr(-r*1.25,r*.5+fl2,r*.45,r*.24,r*.1,'#f2a23a');
  }else if(o.acc==='bow'){ // 糖果：粉紅蝴蝶結
    g.save();g.translate(-r*.1,-r*.95);g.rotate(-.2);g.fillStyle='#ff6fb5';g.beginPath();g.moveTo(0,0);g.lineTo(-r*.55,-r*.32);g.lineTo(-r*.55,r*.32);g.fill();
    g.beginPath();g.moveTo(0,0);g.lineTo(r*.55,-r*.32);g.lineTo(r*.55,r*.32);g.fill();circ(0,0,r*.16,'#ff3d9a');g.restore();

/* ---------- 粒子與文字 ---------- */
function burst(x,y,n,c){for(var i=0;i<n;i++){var a=rnd(0,6.28),s=rnd(60,200);G.pt.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:rnd(.4,.8),c:c,r:rnd(2,4)});}}
function addFx(x,y,txt,col,life){G.fx.push({x:x,y:y,txt:txt,c:col,l:life||1.2,m:life||1.2});}
function updParticles(dt){
  for(var i=G.pt.length-1;i>=0;i--){var p=G.pt[i];p.l-=dt;if(p.l<=0){G.pt.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=KIND()==='river'?0:400*dt;}
  for(i=G.fx.length-1;i>=0;i--){var f=G.fx[i];f.l-=dt;if(f.l<=0)G.fx.splice(i,1);}
  if(G.pt.length>260)G.pt.splice(0,G.pt.length-260);
}
function drawParticles(ox,oy,river){
  for(var i=0;i<G.pt.length;i++){var p=G.pt[i];g.globalAlpha=clamp(p.l*2,0,1);
    var x=river?p.x-ox:p.x-ox,y=river?p.y-oy:p.y-oy;circ(x,y,p.r,p.c);}
  g.globalAlpha=1;
}
function drawFx(ox,oy,river){
  g.font='bold 17px -apple-system,"PingFang TC",sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(var i=0;i<G.fx.length;i++){var f=G.fx[i],u=1-f.l/f.m,x=f.x-ox,y=f.y-oy-u*30;
    g.globalAlpha=clamp(f.l*2.5,0,1);g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.35)';g.strokeText(f.txt,x,y);g.fillStyle=f.c;g.fillText(f.txt,x,y);}
  g.globalAlpha=1;
}

/* ---------- 流程 ---------- */
function start(mode,demo){
  G.mode=mode;G.demo=!!demo;G.decel=0;G.t=0;G.hearts=3;G.got=0;G.inv=0;G.fx=[];G.pt=[];G.endT=0;G.win=false;G.held=false;G.ducks=0;
  if(MODES[mode].kind==='river')riverInit();else slopeInit();
  if(demo){G.state='play';return;}
  G.state='play';
  $('menu').classList.add('hide');$('result').classList.add('hide');$('pause').classList.add('hide');
  $('hud').classList.remove('hide');$('prog').classList.remove('hide');
  var hn=$('hint');hn.textContent=MODES[mode].kind==='river'?'手指按住左右移動，小暖會划過去':'點一下＝跳　空中按住＝翻跟斗';
  hn.classList.remove('hide');hn.style.opacity=1;setTimeout(function(){hn.style.opacity=0;},4500);
  addFx(G.pl.x,KIND()==='river'?-G.pl.d-50:G.pl.y-60,'出發囉！','#fff',1.6);
  updHud();
}
function win(){if(G.state!=='play')return;G.state='end';G.win=true;G.endT=0;SFX.win();
  if(KIND()!=='river')G.decel=G.pl.v*G.pl.v/(2*110);
  var M=MODES[G.mode];if(KIND()==='river')addFx(G.pl.x,-G.pl.d-60,'到家囉！','#fff',2);else addFx(G.pl.x,G.pl.y-70,'到家囉！','#fff',2);}
function lose(){if(G.state!=='play')return;G.state='end';G.win=false;G.endT=0;G.decel=420;setTimeout(SFX.lose,300);}
function showResult(){
  G.state='result';var M=MODES[G.mode];
  $('hud').classList.add('hide');$('prog').classList.add('hide');
  var ratio=G.total?Math.min(1,G.got/G.total):0,stars=0;
  if(KIND()==='river')ratio=G.total?Math.min(1,(G.got+G.ducks*3)/(G.total+G.duckTotal*3)):0;
  if(G.win){stars=ratio>=.7?3:ratio>=.4?2:1;if(G.hearts<2&&stars===3)stars=2;}
  $('rIcon').textContent=G.win?M.res:'😴';
  $('rTitle').textContent=G.win?M.win:'小暖累了，休息一下';
  var s='';for(var i=0;i<3;i++)s+=i<stars?'★':'<span class="off">★</span>';$('rStars').innerHTML=s;
  var stat='收集 '+M.cn+' '+G.got;
  if(KIND()==='river')stat+='　救到 '+M.bn+' '+G.ducks+' / '+G.duckTotal;
  else if(G.pl.flips)stat+='　翻跟斗 🌀 '+G.pl.flips+' 次';
  $('rStat').textContent=G.win?stat:'沒關係，再試一次，小暖相信你！';
  $('rTip').innerHTML=M.tip;
  var idx=ORDER.indexOf(G.mode);$('rNext').style.display=idx<ORDER.length-1?'':'none';
  if(G.win&&(SAVE.best[G.mode]||0)<stars){SAVE.best[G.mode]=stars;save();}
  $('result').classList.remove('hide');
}
function toMenu(){G.state='menu';$('result').classList.add('hide');$('pause').classList.add('hide');$('hud').classList.add('hide');$('prog').classList.add('hide');$('hint').classList.add('hide');
  buildMenu();$('menu').classList.remove('hide');start(pick(ORDER),true);G.state='menu';}

function updHud(){
  var s='';for(var i=0;i<3;i++)s+=i<G.hearts?'❤️':'🤍';$('hHearts').textContent=s;
  $('hCnt').textContent=MODES[G.mode].cn+' '+G.got;
  var x=$('hX');
  if(KIND()==='river'){x.style.display='';x.textContent=MODES[G.mode].bn+' '+G.ducks;}
  else if(G.pl.boost>0){x.style.display='';x.textContent='⭐ '+Math.ceil(G.pl.boost);}
  else x.style.display='none';
  var pr=KIND()==='river'?G.pl.d/R.L:G.pl.x/P.L;pr=clamp(pr,0,1);
  $('progI').style.width=(pr*100)+'%';$('progB').style.left=(pr*100)+'%';
}

/* ---------- 主迴圈 ---------- */
var last=performance.now(),hudT=0;
function frame(now){
  var dt=Math.min(.033,(now-last)/1000);last=now;
  var running=G.state==='play'||G.state==='end'||G.state==='menu';
  if(running){
    G.t+=dt;if(G.inv>0)G.inv-=dt;if(shake>0)shake=Math.max(0,shake-dt*20);
    if(KIND()==='river')updRiver(dt);else updSlope(dt);
    updParticles(dt);
    if(G.state==='end'){G.endT+=dt;if(G.endT>(G.win?2.6:1.6))showResult();}
    if(G.state==='menu'&&KIND()!=='river'&&G.pl.x>P.L+60&&G.pl.v<3)start(pick(ORDER),true),G.state='menu';
    if(G.state==='menu'&&KIND()==='river'&&G.pl.d>R.L+300)start(pick(ORDER),true),G.state='menu';
    hudT+=dt;if(hudT>.1&&G.state==='play'){hudT=0;updHud();}
  }
  g.setTransform(S*DPR,0,0,S*DPR,0,0);
  if(shake>0)g.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(KIND()==='river')drawRiver();else drawSlope();
  requestAnimationFrame(frame);
}
buildMenu();start(pick(ORDER),true);G.state='menu';
// 示範：自動跳
setInterval(function(){if(G.state==='menu'&&KIND()!=='river'&&G.pl.onG&&Math.random()<.3){G.state='play';tapSlope();G.state='menu';}},900);
requestAnimationFrame(frame);

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
